# Telegraf configuration for native Windows host metrics collection
# Run this configuration on the Windows host, not in a container.

[global_tags]
  environment = "${DEPLOYMENT_ENV:development}"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = false
  debug = false
  quiet = false
  logtarget = "stderr"

###############################################################################
#                            OUTPUT PLUGINS                                    #
###############################################################################

# Send host metrics to the OTel Collector OTLP gRPC port published locally.
[[outputs.opentelemetry]]
  service_address = "localhost:4317"

###############################################################################
#                            INPUT PLUGINS                                     #
###############################################################################

[[inputs.win_perf_counters]]
  [[inputs.win_perf_counters.object]]
    ObjectName = "Processor"
    Instances = ["*"]
    Counters = [
      "% Idle Time",
      "% Interrupt Time",
      "% Privileged Time",
      "% User Time",
      "% Processor Time",
      "% DPC Time",
    ]
    Measurement = "win_cpu"
    IncludeTotal = true

  [[inputs.win_perf_counters.object]]
    ObjectName = "Memory"
    Counters = [
      "Available Bytes",
      "Cache Bytes",
      "Committed Bytes",
      "Commit Limit",
      "Cache Faults/sec",
      "Page Faults/sec",
      "Pool Nonpaged Bytes",
      "Pool Paged Bytes",
      "Standby Cache Reserve Bytes",
      "Standby Cache Normal Priority Bytes",
      "Standby Cache Core Bytes",
    ]
    Measurement = "win_mem"

  [[inputs.win_perf_counters.object]]
    ObjectName = "PhysicalDisk"
    Instances = ["*"]
    Counters = [
      "Disk Read Bytes/sec",
      "Disk Write Bytes/sec",
      "Current Disk Queue Length",
      "Disk Reads/sec",
      "Disk Writes/sec",
      "% Disk Time",
      "% Disk Read Time",
      "% Disk Write Time",
    ]
    Measurement = "win_diskio"

  [[inputs.win_perf_counters.object]]
    ObjectName = "Network Interface"
    Instances = ["*"]
    Counters = [
      "Bytes Received/sec",
      "Bytes Sent/sec",
      "Packets Received/sec",
      "Packets Sent/sec",
      "Packets Received Discarded",
      "Packets Outbound Discarded",
      "Packets Received Errors",
      "Packets Outbound Errors",
    ]
    Measurement = "win_net"

# Discover Windows drives automatically; do not configure Linux mount points.
[[inputs.disk]]

[[inputs.win_services]]
  # Replace this placeholder with the rndfwcore/FWCORE service name(s) used here.
  service_names = ["REPLACE_WITH_RNDFWCORE_SERVICE_NAME"]
