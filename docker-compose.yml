# Proactive Log Monitoring System - Full Stack Docker Compose
# Single-server deployment configuration
# Target: 10k-50k events/second

networks:
  monitoring-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  kafka-kraft-data:
  timescaledb-data:
  elasticsearch-data:
  grafana-data:
  otel-checkpoint:
  prometheus-data:

services:
  # ============================================================================
  # MESSAGE BROKER - KAFKA
  # ============================================================================
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_MESSAGE_MAX_BYTES: 2097152
    volumes:
      - kafka-kraft-data:/var/lib/kafka/data
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo 'Creating Kafka topics...'
        sleep 5

        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic telemetry-metrics --partitions 12 --replication-factor 1 --config retention.ms=604800000 --config compression.type=snappy
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic telemetry-logs --partitions 12 --replication-factor 1 --config retention.ms=604800000 --config compression.type=snappy
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic telemetry-traces --partitions 12 --replication-factor 1 --config retention.ms=259200000 --config compression.type=snappy
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic alerts --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic dlq --partitions 3 --replication-factor 1 --config retention.ms=1209600000

        echo 'Topics created:'
        kafka-topics --list --bootstrap-server kafka:9092
    networks:
      - monitoring-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: log-monitoring
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - monitoring-net
    restart: unless-stopped

  # ============================================================================
  # DATABASES
  # ============================================================================

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    hostname: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-monitoring}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-monitoring123}
      POSTGRES_DB: ${TIMESCALE_DB:-metrics}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-monitoring} -d ${TIMESCALE_DB:-metrics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=log-monitoring-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch-init
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo 'Initializing Elasticsearch...'
        sleep 10

        # Create ILM policy
        curl --fail -sS -X PUT 'http://elasticsearch:9200/_ilm/policy/logs-policy' \
          -H 'Content-Type: application/json' \
          -d '{
            "policy": {
              "phases": {
                "hot": { "min_age": "0ms", "actions": { "rollover": { "max_age": "1d", "max_primary_shard_size": "50gb" } } },
                "warm": { "min_age": "2d", "actions": { "forcemerge": { "max_num_segments": 1 } } },
                "delete": { "min_age": "30d", "actions": { "delete": {} } }
              }
            }
          }'

        # Create index template. Covers every field LogRecord serializes; unknown
        # top-level strings fall to the keyword dynamic template instead of the
        # default text+keyword pair. attributes/resource/instrumentation_scope are
        # flattened (like traces) so unbounded rndfwcore attribute keys cannot
        # explode the field count.
        curl --fail -sS -X PUT 'http://elasticsearch:9200/_index_template/logs-template' \
          -H 'Content-Type: application/json' \
          -d '{
            "index_patterns": ["logs-*"],
            "template": {
              "settings": {
                "number_of_shards": 3,
                "number_of_replicas": 0,
                "index.lifecycle.name": "logs-policy",
                "index.lifecycle.rollover_alias": "logs"
              },
              "mappings": {
                "dynamic_templates": [
                  { "strings_as_keywords": { "match_mapping_type": "string", "mapping": { "type": "keyword", "ignore_above": 1024 } } }
                ],
                "properties": {
                  "@timestamp": { "type": "date" },
                  "observed_timestamp": { "type": "date" },
                  "message": { "type": "text" },
                  "level": { "type": "keyword" },
                  "severity_number": { "type": "integer" },
                  "service_name": { "type": "keyword" },
                  "service_version": { "type": "keyword" },
                  "host_name": { "type": "keyword" },
                  "environment": { "type": "keyword" },
                  "trace_id": { "type": "keyword" },
                  "span_id": { "type": "keyword" },
                  "correlation_id": { "type": "keyword" },
                  "user_id": { "type": "keyword" },
                  "session_id": { "type": "keyword" },
                  "request_id": { "type": "keyword" },
                  "logger_name": { "type": "keyword" },
                  "thread_name": { "type": "keyword" },
                  "exception": {
                    "properties": {
                      "type": { "type": "keyword" },
                      "message": { "type": "text" },
                      "stacktrace": { "type": "text" }
                    }
                  },
                  "attributes": { "type": "flattened" },
                  "resource": { "type": "flattened" },
                  "instrumentation_scope": { "type": "flattened" }
                }
              }
            }
          }'

        # Bootstrap the write index only when the alias is absent, i.e. a fresh volume.
        # After the first ILM rollover the alias points at a later generation and
        # logs-000001 may be gone entirely, so re-creating it is wrong rather than
        # merely redundant: it would claim is_write_index for a second index.
        # Match 404 exactly. Treating any non-2xx as "absent" would send a transient 503
        # (the healthcheck accepts yellow, so the cluster may still be recovering) down
        # the bootstrap path, where the PUT fails, --fail returns non-zero and set -e
        # aborts before the traces template is ever created.
        logs_alias_status=$$(curl -s -o /dev/null -w '%{http_code}' 'http://elasticsearch:9200/_alias/logs')
        if [ "$$logs_alias_status" = "404" ]; then
          echo 'No logs alias; bootstrapping logs-000001 as the write index'
          curl --fail -sS -X PUT 'http://elasticsearch:9200/logs-000001' \
            -H 'Content-Type: application/json' \
            -d '{ "aliases": { "logs": { "is_write_index": true } } }'
          echo
        elif [ "$$logs_alias_status" = "200" ]; then
          echo 'logs alias exists; ILM owns the index names, nothing to bootstrap'
        else
          echo "Unexpected status $$logs_alias_status probing the logs alias; aborting"
          exit 1
        fi

        # Create traces ILM policy (same warm forcemerge as logs). No shrink action:
        # shrink replaces the index with a renamed shrink-* copy, which breaks
        # every index-pattern-based operation for little gain on a single node.
        # The Grafana datasources query the logs/traces ALIASES for the same
        # reason — ILM owns index names, so nothing should depend on them.
        curl --fail -sS -X PUT 'http://elasticsearch:9200/_ilm/policy/traces-policy' \
          -H 'Content-Type: application/json' \
          -d '{
            "policy": {
              "phases": {
                "hot": { "min_age": "0ms", "actions": { "rollover": { "max_age": "1d", "max_primary_shard_size": "50gb" } } },
                "warm": { "min_age": "2d", "actions": { "forcemerge": { "max_num_segments": 1 } } },
                "delete": { "min_age": "14d", "actions": { "delete": {} } }
              }
            }
          }'

        # Create traces index template
        curl --fail -sS -X PUT 'http://elasticsearch:9200/_index_template/traces-template' \
          -H 'Content-Type: application/json' \
          -d '{
            "index_patterns": ["traces-*"],
            "template": {
              "settings": {
                "number_of_shards": 3,
                "number_of_replicas": 0,
                "index.lifecycle.name": "traces-policy",
                "index.lifecycle.rollover_alias": "traces"
              },
              "mappings": {
                "dynamic_templates": [
                  { "strings_as_keywords": { "match_mapping_type": "string", "mapping": { "type": "keyword", "ignore_above": 1024 } } }
                ],
                "properties": {
                  "trace_id": { "type": "keyword" },
                  "span_id": { "type": "keyword" },
                  "parent_span_id": { "type": "keyword" },
                  "kind": { "type": "keyword" },
                  "status_code": { "type": "keyword" },
                  "service_name": { "type": "keyword" },
                  "host_name": { "type": "keyword" },
                  "environment": { "type": "keyword" },
                  "session_id": { "type": "keyword" },
                  "operation_id": { "type": "keyword" },
                  "client_request_tran_id": { "type": "keyword" },
                  "user_name": { "type": "keyword" },
                  "bp_name": { "type": "keyword" },
                  "bp_method": { "type": "keyword" },
                  "bp_result": { "type": "keyword" },
                  "dq_name": { "type": "keyword" },
                  "dq_method": { "type": "keyword" },
                  "db_operation": { "type": "keyword" },
                  "sql_danger_flags": { "type": "keyword" },
                  "sql_id": { "type": "keyword" },
                  "sql_transaction_id": { "type": "keyword" },
                  "db_system": { "type": "keyword" },
                  "db_name": { "type": "keyword" },
                  "job_name": { "type": "keyword" },
                  "job_queue": { "type": "keyword" },
                  "job_run_id": { "type": "keyword" },
                  "job_status": { "type": "keyword" },
                  "transport": { "type": "keyword" },
                  "client_address": { "type": "keyword" },
                  "duration_ms": { "type": "double" },
                  "db_rows_affected": { "type": "double" },
                  "error": { "type": "boolean" },
                  "name": { "type": "keyword", "ignore_above": 1024 },
                  "db_statement": { "type": "text" },
                  "status_message": { "type": "text" },
                  "@timestamp": { "type": "date" },
                  "end_timestamp": { "type": "date" },
                  "attributes": { "type": "flattened" },
                  "service_version": { "type": "keyword" },
                  "resource": { "type": "flattened" },
                  "events": { "properties": { "name": { "type": "keyword" }, "timestamp": { "type": "date" }, "attributes": { "type": "flattened" } } }
                }
              }
            }
          }'

        # Bootstrap the traces write index on the same alias-absent condition as logs.
        # Same exact-404 handling as the logs alias above.
        traces_alias_status=$$(curl -s -o /dev/null -w '%{http_code}' 'http://elasticsearch:9200/_alias/traces')
        if [ "$$traces_alias_status" = "404" ]; then
          echo 'No traces alias; bootstrapping traces-000001 as the write index'
          curl --fail -sS -X PUT 'http://elasticsearch:9200/traces-000001' \
            -H 'Content-Type: application/json' \
            -d '{ "aliases": { "traces": { "is_write_index": true } } }'
          echo
        elif [ "$$traces_alias_status" = "200" ]; then
          echo 'traces alias exists; ILM owns the index names, nothing to bootstrap'
        else
          echo "Unexpected status $$traces_alias_status probing the traces alias; aborting"
          exit 1
        fi

        echo 'Elasticsearch initialization complete!'

    networks:
      - monitoring-net

  # ============================================================================
  # TELEMETRY COLLECTION
  # ============================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: otel-collector
    hostname: otel-collector
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (self)
      - "13133:13133" # Health check
      - "56679:55679" # zPages (host port moved off the Windows NAT reserved range 55634-55933)
    volumes:
      - ./docker/otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-checkpoint:/var/lib/otelcol
    environment:
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV:-development}
      - SERVICE_NAMESPACE=log-monitoring
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  # Prometheus scrapes the collector's self-telemetry (otel-collector:8888) so
  # Grafana's collector-health panels and the collector-export-failures alert
  # have a real query API — the collector itself only exposes /metrics.
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    hostname: prometheus
    depends_on:
      - otel-collector
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    networks:
      - monitoring-net
    restart: unless-stopped

  # ============================================================================
  # CONSUMERS
  # ============================================================================

  metrics-consumer:
    build:
      context: .
      dockerfile: src/Consumers/MetricsConsumer/Dockerfile
    container_name: metrics-consumer
    hostname: metrics-consumer
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroupId=metrics-consumer-group
      - Kafka__MetricsTopic=telemetry-metrics
      - TimescaleDb__ConnectionString=Host=timescaledb;Port=5432;Database=metrics;Username=monitoring;Password=monitoring123
    networks:
      - monitoring-net
    restart: unless-stopped

  logs-consumer:
    build:
      context: .
      dockerfile: src/Consumers/LogsConsumer/Dockerfile
    container_name: logs-consumer
    hostname: logs-consumer
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroupId=logs-consumer-group
      - Kafka__LogsTopic=telemetry-logs
      - Kafka__DlqTopic=dlq
      - Elasticsearch__Url=http://elasticsearch:9200
      - Elasticsearch__IndexAlias=logs
    networks:
      - monitoring-net
    restart: unless-stopped

  traces-consumer:
    build:
      context: .
      dockerfile: src/Consumers/TracesConsumer/Dockerfile
    container_name: traces-consumer
    hostname: traces-consumer
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroupId=traces-consumer-group
      - Kafka__TracesTopic=telemetry-traces
      - Kafka__DlqTopic=dlq
      - Elasticsearch__Url=http://elasticsearch:9200
      - Elasticsearch__IndexAlias=traces
    networks:
      - monitoring-net
    restart: unless-stopped

  # ============================================================================
  # VISUALIZATION
  # ============================================================================

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    hostname: grafana
    depends_on:
      timescaledb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      # Consumed via $__env{} in provisioning/alerting/contact-points.yaml.
      # Set real values per deployment; the defaults are non-routable placeholders.
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-support-alerts@example.invalid}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-http://localhost:9/alert-webhook-not-configured}
      # --- Session enrichment (optional, off by default) ---------------------
      # Read-only lookup of SessionID against the monitored app's SQL Server.
      # Provisioned only when SESSION_ENRICHMENT=enabled (see volumes below).
      # Set these in .env -- never commit real credentials. See
      # deploy/session-enrichment/README.md.
      - SESSION_ENRICHMENT_MSSQL_URL=${SESSION_ENRICHMENT_MSSQL_URL:-}
      - SESSION_ENRICHMENT_MSSQL_DB=${SESSION_ENRICHMENT_MSSQL_DB:-}
      - SESSION_ENRICHMENT_MSSQL_USER=${SESSION_ENRICHMENT_MSSQL_USER:-}
      - SESSION_ENRICHMENT_MSSQL_PASSWORD=${SESSION_ENRICHMENT_MSSQL_PASSWORD:-}
      # Grafana encrypts secureJsonData with this key. The built-in default is a
      # well-known constant -- set a real value wherever a DB password is stored.
      - GF_SECURITY_SECRET_KEY=${GF_SECURITY_SECRET_KEY:-SW2YcwTIb9zpOOhoPsMm}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # SESSION_ENRICHMENT selects the "enabled" or "disabled" variant of both
      # files. Default is disabled: no datasource, no credentials, no DB reach.
      # These land inside the provisioning mount above; the target paths exist
      # as committed placeholder files (disabled-variant copies), because a file
      # bind-mount inside the read-only provisioning mount cannot create its own
      # mountpoint -- it can only cover an existing file.
      - ./docker/grafana/enrichment/${SESSION_ENRICHMENT:-disabled}/datasource.yaml:/etc/grafana/provisioning/datasources/session-enrichment.yaml:ro
      - ./docker/grafana/enrichment/${SESSION_ENRICHMENT:-disabled}/session-lookup.json:/etc/grafana/provisioning/dashboards/json/session-lookup.json:ro
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - SERVER_NAME=kibana
      - TELEMETRY_ENABLED=false
    networks:
      - monitoring-net
    restart: unless-stopped
