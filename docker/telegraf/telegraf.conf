# Telegraf Configuration for Proactive Log Monitoring System
# Collects system metrics and .NET CLR metrics
# DEPRECATED for host metrics collection. The canonical native Windows host
# configuration is in deploy/telegraf-windows/.

# Global tags applied to all metrics
[global_tags]
  environment = "${DEPLOYMENT_ENV:development}"
  service_namespace = "log-monitoring"

# Agent configuration
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = false
  debug = false
  quiet = false
  logtarget = "stderr"

###############################################################################
#                            OUTPUT PLUGINS                                    #
###############################################################################

# Prometheus output for OTel Collector scraping
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "60s"
  collectors_exclude = ["gocollector", "process"]
  path = "/metrics"

###############################################################################
#                            INPUT PLUGINS                                     #
###############################################################################

# CPU metrics
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  core_tags = false

# Memory metrics
[[inputs.mem]]

# Disk metrics
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
  mount_points = ["/", "/var", "/home"]

# Disk I/O metrics
[[inputs.diskio]]
  devices = ["sd*", "nvme*", "xvd*"]

# Network metrics
[[inputs.net]]
  interfaces = ["eth*", "en*", "ens*"]
  ignore_protocol_stats = false

# System metrics (load, uptime, etc.)
[[inputs.system]]

# Process metrics
[[inputs.processes]]

# Kernel metrics (Linux only)
[[inputs.kernel]]

# Linux kernel vmstat (Linux only)
[[inputs.kernel_vmstat]]

# Swap metrics
[[inputs.swap]]

# Network stats (connections, etc.)
[[inputs.netstat]]

# Docker container metrics
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice = true
  perdevice_include = ["cpu", "blkio", "network"]
  total = true
  total_include = ["cpu", "blkio", "network"]
  docker_label_include = []
  docker_label_exclude = []

