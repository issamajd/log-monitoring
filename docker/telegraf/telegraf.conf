###############################################################################
#                         PROCESSOR PLUGINS                                    #
###############################################################################

# Transform metric names/tags
[[processors.rename]]
  [[processors.rename.replace]]
    tag = "host"
    dest = "hostname"

# Add calculated fields
[[processors.starlark]]
  source = '''
def apply(metric):
    # Add epoch timestamp in milliseconds
    metric.fields["timestamp_ms"] = metric.time // 1000000
    return metric
'''

###############################################################################
#                      AGGREGATOR PLUGINS                                      #
###############################################################################

# Calculate min, max, mean, etc. over time windows
[[aggregators.basicstats]]
  period = "60s"
  drop_original = false
  stats = ["count", "min", "max", "mean", "stdev"]
