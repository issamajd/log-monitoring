# Kafka Docker Compose configuration
# Single broker for development, 3 brokers for production cluster

version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_REPLICA_FETCH_MAX_BYTES: 2097152
      # Performance tuning
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      sleep 10

      echo 'Creating telemetry topics...'
      
      # Create metrics topic - higher partitions for throughput
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:9092 \
        --topic telemetry-metrics \
        --partitions 12 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --config compression.type=snappy \
        --config cleanup.policy=delete

      # Create logs topic
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:9092 \
        --topic telemetry-logs \
        --partitions 12 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --config compression.type=snappy \
        --config cleanup.policy=delete

      # Create traces topic
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:9092 \
        --topic telemetry-traces \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=259200000 \
        --config compression.type=snappy \
        --config cleanup.policy=delete

      # Create alerts topic for alert processing
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:9092 \
        --topic alerts \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=604800000

      # Create dead letter queue for failed messages
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:9092 \
        --topic dlq \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=1209600000

      echo 'Listing created topics:'
      kafka-topics --list --bootstrap-server kafka:9092

      echo 'Topic creation completed!'
      "
    networks:
      - monitoring-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: log-monitoring
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - monitoring-net
    restart: unless-stopped

networks:
  monitoring-net:
    external: true

volumes:
  kafka-data:
    external: true
  zookeeper-data:
    external: true
  zookeeper-logs:
    external: true
