# Grafana data sources provisioning
apiVersion: 1

datasources:
  # TimescaleDB (PostgreSQL) for metrics
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: metrics
    user: monitoring
    secureJsonData:
      password: monitoring123
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: true
    isDefault: true

  # Elasticsearch for logs
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "logs-*"
    jsonData:
      esVersion: "8.0.0"
      timeField: "@timestamp"
      logLevelField: "level"
      logMessageField: "message"
      maxConcurrentShardRequests: 5
      includeFrozen: false

  # Prometheus (OTel Collector self-metrics)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://otel-collector:8889
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
