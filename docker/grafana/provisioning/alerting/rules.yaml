  # ─────────────────────────────── risky-sql ───────────────────────────────
  - orgId: 1
    name: risky-sql
    folder: Log Monitoring Alerts
    interval: 1m
    rules:
      - uid: risky-sql-change
        title: Risky SQL Change Detected
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "{{ $values.B }} risky data-change SQL span(s) in last 5m (danger_flags set on DELETE/UPDATE/INSERT)"
          description: "Investigate on the SQL Insight dashboard (/d/sql-insight)."
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: '_exists_:sql_danger_flags AND NOT sql_danger_flags:none AND NOT sql_danger_flags:"" AND (db_operation:delete OR db_operation:update OR db_operation:insert)'
              metrics:
                - id: "1"
                  type: count
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: sum
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: risky-sql-large-rows
        title: Risky SQL Large Row Count
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          team: support
          severity: warning
        annotations:
          summary: "Data-change affected {{ $values.B }} rows (>10k) — review WHERE scope"
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "(db_operation:delete OR db_operation:update) AND db_rows_affected:>10000"
              metrics:
                - id: "1"
                  type: max
                  field: db_rows_affected
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: max
              # dropNN: an empty series otherwise reduces to NaN, which passes gt thresholds.
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [10000] }

