# Grafana 10.2 unified alerting provisioning: alert rule groups.
# Datasource UIDs used below (timescaledb, es-logs, es-traces, prometheus-collector)
# must exist in docker/grafana/provisioning/datasources/datasources.yaml.
apiVersion: 1

groups:
  # ─────────────────────────────── latency ───────────────────────────────
  - orgId: 1
    name: latency
    folder: Log Monitoring Alerts
    interval: 1m
    rules:
      - uid: api-bp-latency-warning
        title: API/BP Latency Warning
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: warning
        annotations:
          summary: "API/BP p95 latency {{ $values.B }}ms > 3s (warn) for 5m"
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "((kind:SERVER OR kind:CLIENT) AND NOT _exists_:bp_name AND NOT _exists_:dq_name AND NOT _exists_:db_operation AND NOT _exists_:job_name) OR _exists_:bp_name"
              metrics:
                - id: "1"
                  type: percentiles
                  field: duration_ms
                  settings: { percents: ["95"] }
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              # max over the window's 1m buckets, dropping empty trailing buckets —
              # "last" would read the partial/zero-filled newest bucket and never fire.
              reducer: max
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [3000] }

      - uid: api-bp-latency-critical
        title: API/BP Latency Critical
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "API/BP p95 {{ $values.B }}ms > 10s (crit)"
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "((kind:SERVER OR kind:CLIENT) AND NOT _exists_:bp_name AND NOT _exists_:dq_name AND NOT _exists_:db_operation AND NOT _exists_:job_name) OR _exists_:bp_name"
              metrics:
                - id: "1"
                  type: percentiles
                  field: duration_ms
                  settings: { percents: ["95"] }
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              # max over the window's 1m buckets, dropping empty trailing buckets —
              # "last" would read the partial/zero-filled newest bucket and never fire.
              reducer: max
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [10000] }

      - uid: sql-latency-warning
        title: SQL Latency Warning
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: warning
        annotations:
          summary: "SQL p95 {{ $values.B }}ms > 1s (warn)"
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "_exists_:db_operation"
              metrics:
                - id: "1"
                  type: percentiles
                  field: duration_ms
                  settings: { percents: ["95"] }
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              # max over the window's 1m buckets, dropping empty trailing buckets —
              # "last" would read the partial/zero-filled newest bucket and never fire.
              reducer: max
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [1000] }

      - uid: sql-latency-critical
        title: SQL Latency Critical
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "SQL p95 {{ $values.B }}ms > 5s (crit)"
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "_exists_:db_operation"
              metrics:
                - id: "1"
                  type: percentiles
                  field: duration_ms
                  settings: { percents: ["95"] }
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              # max over the window's 1m buckets, dropping empty trailing buckets —
              # "last" would read the partial/zero-filled newest bucket and never fire.
              reducer: max
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [5000] }

      - uid: dq-job-latency-warning
        title: DQ/Job Latency Warning
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: warning
        annotations:
          summary: "DQ/Job p95 {{ $values.B }}ms > 3s"
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "_exists_:dq_name OR _exists_:job_name"
              metrics:
                - id: "1"
                  type: percentiles
                  field: duration_ms
                  settings: { percents: ["95"] }
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              # max over the window's 1m buckets, dropping empty trailing buckets —
              # "last" would read the partial/zero-filled newest bucket and never fire.
              reducer: max
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [3000] }

      # Optional critical twin of dq-job-latency-warning, as suggested by the spec.
      - uid: dq-job-latency-critical
        title: DQ/Job Latency Critical
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "DQ/Job p95 {{ $values.B }}ms > 10s"
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "_exists_:dq_name OR _exists_:job_name"
              metrics:
                - id: "1"
                  type: percentiles
                  field: duration_ms
                  settings: { percents: ["95"] }
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              # max over the window's 1m buckets, dropping empty trailing buckets —
              # "last" would read the partial/zero-filled newest bucket and never fire.
              reducer: max
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
