          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: sum
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [50] }

      - uid: error-rate-spike-critical
        title: Error Rate Spike (Critical)
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "{{ $values.B }} ERROR/FATAL logs in 5m (>200)"
        data:
          - refId: A
            datasourceUid: es-logs
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
