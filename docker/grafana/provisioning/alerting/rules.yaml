              metrics:
                - id: "1"
                  type: count
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: sum
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [200] }

      - uid: fatal-log
        title: Fatal Log Occurred
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "{{ $values.B }} FATAL log(s) in last 5m"
        data:
          - refId: A
            datasourceUid: es-logs
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "level:FATAL"
              metrics:
                - id: "1"
                  type: count
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: sum
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }

  # ─────────────────────────────── ingestion ───────────────────────────────
  - orgId: 1
    name: ingestion
    folder: Log Monitoring Alerts
    interval: 1m
    rules:
      - uid: ingestion-stopped-logs
        title: Logs Ingestion Stopped
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "No new log documents indexed in the last 5 minutes — logs ingestion pipeline may be down (collector/Kafka/LogsConsumer/ES)."
        data:
          - refId: A
            datasourceUid: es-logs
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "*"
              metrics:
                - id: "1"
                  type: count
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: sum
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: ingestion-stopped-traces
        title: Traces Ingestion Stopped
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "No new trace documents in 5m — traces pipeline may be down."
        data:
          - refId: A
            datasourceUid: es-traces
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              queryType: lucene
              timeField: "@timestamp"
              query: "*"
              metrics:
                - id: "1"
                  type: count
              bucketAggs:
                - id: "2"
                  type: date_histogram
                  field: "@timestamp"
                  settings: { interval: "1m", min_doc_count: "0" }
              intervalMs: 60000
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: sum
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: ingestion-stopped-metrics
        title: Metrics Ingestion Stopped
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "No metric rows written to TimescaleDB in 5m — MetricsConsumer/Telegraf/collector may be down."
        data:
          - refId: A
            datasourceUid: timescaledb
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              datasource: { type: postgres, uid: timescaledb }
              format: table
              rawSql: |
                SELECT NOW() AS "time", COUNT(*)::float AS value
                FROM metrics.raw_metrics WHERE time >= NOW() - INTERVAL '5 minutes';
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              # max over the window's 1m buckets, dropping empty trailing buckets —
              # "last" would read the partial/zero-filled newest bucket and never fire.
              reducer: max
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [1] }

  # ─────────────────────────────── capacity ───────────────────────────────
  - orgId: 1
    name: capacity
    folder: Log Monitoring Alerts
    interval: 5m
    rules:
      - uid: disk-almost-full-warning
        title: Disk Almost Full (Warning)
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: warning
        annotations:
          summary: "Disk usage {{ $values.B }}% > 80% (warn) on a monitored volume for 10m"
        data:
          - refId: A
            datasourceUid: timescaledb
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              datasource: { type: postgres, uid: timescaledb }
              format: time_series
              rawSql: |
                SELECT time, host_name||' '||COALESCE(labels->>'instance',labels->>'path','?') AS metric, value
                FROM metrics.raw_metrics
                WHERE metric_name = 'disk_used_percent'
                  AND time >= NOW() - INTERVAL '10 minutes'
                ORDER BY time;
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: max
              # dropNN: an empty series otherwise reduces to NaN, which passes gt thresholds.
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [80] }

      - uid: disk-almost-full-critical
        title: Disk Almost Full (Critical)
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "Disk usage {{ $values.B }}% > 90% (crit)."
        data:
          - refId: A
            datasourceUid: timescaledb
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              datasource: { type: postgres, uid: timescaledb }
              format: time_series
              rawSql: |
                SELECT time, host_name||' '||COALESCE(labels->>'instance',labels->>'path','?') AS metric, value
                FROM metrics.raw_metrics
                WHERE metric_name = 'disk_used_percent'
                  AND time >= NOW() - INTERVAL '10 minutes'
                ORDER BY time;
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: max
              # dropNN: an empty series otherwise reduces to NaN, which passes gt thresholds.
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [90] }

  # ─────────────────────────────── service ───────────────────────────────
  - orgId: 1
    name: service
    folder: Log Monitoring Alerts
    interval: 1m
    rules:
      - uid: windows-service-down
        title: Windows Service Down
        condition: C
        for: 3m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: critical
        annotations:
          summary: "Windows service {{ $labels.metric }} is not Running (state {{ $values.B }}) for 3m."
          description: "Requires deploy/telegraf-windows/telegraf.conf win_services placeholder REPLACE_WITH_RNDFWCORE_SERVICE_NAME to be filled; if this never fires and P7 shows NoData, the service metric isn't being emitted."
        data:
          - refId: A
            datasourceUid: timescaledb
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              datasource: { type: postgres, uid: timescaledb }
              format: time_series
              rawSql: |
                SELECT time, host_name||'/'||COALESCE(labels->>'service_name','svc') AS metric, value
                FROM metrics.raw_metrics
                WHERE metric_name = 'win_services_state'
                  AND time >= NOW() - INTERVAL '5 minutes'
                ORDER BY time;
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              # Fires on any state != Running (4): Stopped(1), pending states, Paused(7).
              type: math
              expression: $B != 4
              datasource: { type: __expr__, uid: __expr__ }

  # ─────────────────────────────── collector (optional) ───────────────────────────────
  - orgId: 1
    name: collector
    folder: Log Monitoring Alerts
    interval: 1m
    rules:
      - uid: collector-export-failures
        title: Collector Export Failures
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          team: support
          severity: warning
        annotations:
          summary: "Collector is failing to export telemetry to Kafka ({{ $values.B }}/s failures)."
        data:
          - refId: A
            datasourceUid: prometheus-collector
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus-collector }
              instant: true
              range: false
              expr: >-
                sum(rate(otelcol_exporter_send_failed_spans[5m])) +
                sum(rate(otelcol_exporter_send_failed_metric_points[5m])) +
                sum(rate(otelcol_exporter_send_failed_log_records[5m]))
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: B
              type: reduce
              expression: A
              # max over the window's 1m buckets, dropping empty trailing buckets —
              # "last" would read the partial/zero-filled newest bucket and never fire.
              reducer: max
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
