# Elasticsearch Docker Compose configuration
# Log storage and search engine

version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=log-monitoring-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      # Performance settings
      - indices.query.bool.max_clause_count=4096
      - search.max_buckets=100000
      - action.destructive_requires_name=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./index-templates:/usr/share/elasticsearch/config/templates:ro
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Elasticsearch initialization - applies templates and ILM policies
  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch-init
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for Elasticsearch to be fully ready...'
      sleep 10

      echo 'Creating ILM policy for logs...'
      curl -X PUT 'http://elasticsearch:9200/_ilm/policy/logs-policy' \
        -H 'Content-Type: application/json' \
        -d '{
          \"policy\": {
            \"phases\": {
              \"hot\": {
                \"min_age\": \"0ms\",
                \"actions\": {
                  \"rollover\": {
                    \"max_age\": \"1d\",
                    \"max_primary_shard_size\": \"50gb\"
                  },
                  \"set_priority\": {
                    \"priority\": 100
                  }
                }
              },
              \"warm\": {
                \"min_age\": \"2d\",
                \"actions\": {
                  \"set_priority\": {
                    \"priority\": 50
                  },
                  \"shrink\": {
                    \"number_of_shards\": 1
                  },
                  \"forcemerge\": {
                    \"max_num_segments\": 1
                  }
                }
              },
              \"cold\": {
                \"min_age\": \"7d\",
                \"actions\": {
                  \"set_priority\": {
                    \"priority\": 0
                  }
                }
              },
              \"delete\": {
                \"min_age\": \"30d\",
                \"actions\": {
                  \"delete\": {}
                }
              }
            }
          }
        }'

      echo ''
      echo 'Creating index template for logs...'
      curl -X PUT 'http://elasticsearch:9200/_index_template/logs-template' \
        -H 'Content-Type: application/json' \
        -d '{
          \"index_patterns\": [\"logs-*\"],
          \"template\": {
            \"settings\": {
              \"number_of_shards\": 3,
              \"number_of_replicas\": 0,
              \"index.lifecycle.name\": \"logs-policy\",
              \"index.lifecycle.rollover_alias\": \"logs\",
              \"index.refresh_interval\": \"5s\",
              \"index.translog.durability\": \"async\",
              \"index.translog.sync_interval\": \"5s\"
            },
            \"mappings\": {
              \"dynamic\": \"true\",
              \"dynamic_templates\": [
                {
                  \"strings_as_keywords\": {
                    \"match_mapping_type\": \"string\",
                    \"mapping\": {
                      \"type\": \"keyword\",
                      \"ignore_above\": 1024
                    }
                  }
                }
              ],
              \"properties\": {
                \"@timestamp\": {
                  \"type\": \"date\"
                },
                \"time\": {
                  \"type\": \"date\"
                },
                \"message\": {
                  \"type\": \"text\",
                  \"fields\": {
                    \"keyword\": {
                      \"type\": \"keyword\",
                      \"ignore_above\": 32766
                    }
                  }
                },
                \"level\": {
                  \"type\": \"keyword\"
                },
                \"severity\": {
                  \"type\": \"keyword\"
                },
                \"service_name\": {
                  \"type\": \"keyword\"
                },
                \"service_version\": {
                  \"type\": \"keyword\"
                },
                \"host_name\": {
                  \"type\": \"keyword\"
                },
                \"environment\": {
                  \"type\": \"keyword\"
                },
                \"trace_id\": {
                  \"type\": \"keyword\"
                },
                \"span_id\": {
                  \"type\": \"keyword\"
                },
                \"correlation_id\": {
                  \"type\": \"keyword\"
                },
                \"user_id\": {
                  \"type\": \"keyword\"
                },
                \"session_id\": {
                  \"type\": \"keyword\"
                },
                \"request_id\": {
                  \"type\": \"keyword\"
                },
                \"exception_type\": {
                  \"type\": \"keyword\"
                },
                \"exception_message\": {
                  \"type\": \"text\"
                },
                \"stack_trace\": {
                  \"type\": \"text\",
                  \"index\": false
                },
                \"logger_name\": {
                  \"type\": \"keyword\"
                },
                \"thread_name\": {
                  \"type\": \"keyword\"
                },
                \"attributes\": {
                  \"type\": \"object\",
                  \"dynamic\": true
                },
                \"resource\": {
                  \"type\": \"object\",
                  \"dynamic\": true
                }
              }
            }
          },
          \"priority\": 100
        }'

      echo ''
      echo 'Creating initial logs index with alias...'
      curl -X PUT 'http://elasticsearch:9200/logs-000001' \
        -H 'Content-Type: application/json' \
        -d '{
          \"aliases\": {
            \"logs\": {
              \"is_write_index\": true
            }
          }
        }'

      echo ''
      echo 'Elasticsearch initialization completed!'
      "
    networks:
      - monitoring-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - SERVER_NAME=kibana
      - TELEMETRY_ENABLED=false
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

networks:
  monitoring-net:
    external: true

volumes:
  elasticsearch-data:
    external: true
